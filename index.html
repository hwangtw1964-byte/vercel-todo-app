<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 실습 프로젝트</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --badge-bg: #f3f4f6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --card: #1f2937;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --border: #374151;
        --accent: #60a5fa;
        --badge-bg: #374151;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 48px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 1000px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 36px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    header p { margin: 0; color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .card:not(.disabled):hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }
    .card.disabled { cursor: not-allowed; opacity: 0.75; }
    .icon { font-size: 36px; line-height: 1; }
    .num { font-size: 13px; color: var(--muted); font-weight: 600; }
    .card h2 { margin: 0; font-size: 19px; }
    .badge {
      align-self: flex-start;
      margin-top: auto;
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 999px;
      background: var(--badge-bg);
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>나의 실습 프로젝트</h1>
      <p>실습으로 만든 웹앱들을 모아두는 공간입니다.</p>
    </header>

    <main class="grid" id="grid"></main>
  </div>

  <script>
    // 링크가 준비되면 url 값에 주소를 넣으면 카드가 활성화됩니다.
    const projects = [
      { icon: '✅', title: '할일 목록 리스트',       url: '' },
      { icon: '🐍', title: '클로드 활용 스네이크 게임', url: '' },
      { icon: '🙋', title: '개인 프로파일',          url: '' },
      { icon: '📈', title: '주식 일기',              url: '' },
      { icon: '🦾', title: '4축 로봇암 시뮬레이터',    url: '' },
      { icon: '📚', title: '이북(ebook) 쇼핑몰',      url: '' },
    ];

    const grid = document.getElementById('grid');
    projects.forEach((p, i) => {
      const card = document.createElement(p.url ? 'a' : 'div');
      card.className = 'card' + (p.url ? '' : ' disabled');
      if (p.url) card.href = p.url;
      else card.setAttribute('aria-disabled', 'true');

      card.innerHTML = `
        <div class="icon">${p.icon}</div>
        <div class="num">PROJECT ${String(i + 1).padStart(2, '0')}</div>
        <h2></h2>
        <span class="badge">${p.url ? '바로가기 →' : '준비 중'}</span>
      `;
      card.querySelector('h2').textContent = p.title;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
